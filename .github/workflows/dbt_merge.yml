name: dbt Deploy on Merge

on:
  push:
    branches:
      - main
    paths:
      - 'models/**'
      - 'tests/**'
      - 'macros/**'
      - 'seeds/**'
      - 'snapshots/**'
      - 'dbt_project.yml'
      - 'packages.yml'

jobs:
  dbt-deploy:
    name: Deploy to production
    runs-on: ubuntu-latest

    env:
      DBT_PROFILES_DIR: ${{ github.workspace }}
      DBT_TARGET: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dbt
        run: |
          pip install --upgrade pip
          pip install dbt-snowflake

      - name: Write profiles.yml
        run: |
          cat > profiles.yml <<EOF
          default:
            target: prod
            outputs:
              prod:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                password: ${{ secrets.SNOWFLAKE_PASSWORD }}
                role: ${{ secrets.SNOWFLAKE_ROLE }}
                warehouse: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
                database: ${{ secrets.SNOWFLAKE_DATABASE }}
                schema: ${{ secrets.SNOWFLAKE_SCHEMA }}
                threads: 8
          EOF

      - name: Install dbt packages
        run: dbt deps

      - name: dbt seed
        run: dbt seed

      - name: dbt run
        run: dbt run

      - name: dbt test
        run: dbt test

      - name: dbt run project evaluator
        run: dbt build --select package:dbt_project_evaluator --store-failures

      - name: Upload production manifest
        run: |
          # Upload the updated manifest for use in slim CI
          # Replace with your actual artifact storage upload command
          # e.g., aws s3 cp target/manifest.json s3://your-bucket/manifest.json
          echo "Upload manifest.json to artifact storage here"

      - name: Notify on failure
        if: failure()
        run: |
          echo "dbt deployment failed. Check the logs above."
