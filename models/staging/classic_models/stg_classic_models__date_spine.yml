version: 2

models:
  - name: stg_classic_models__date_spine
    description: >
      Contiguous daily date spine generated by dbt_utils.date_spine covering the full
      range of transactional dates in the Classic Models dataset (2003-01-01 through
      2005-12-31 inclusive). Feeds dim_date in the mart layer.
    columns:
      - name: date_day
        description: Calendar date; one row per day.
        data_tests:
          - not_null
          - unique
