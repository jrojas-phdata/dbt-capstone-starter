version: 2

models:
  - name: fct_orders
    description: >
      Order line-item fact table at the grain of one row per order-product combination.
      Surrogate keys align with dim_orders, dim_products, and dim_customers for
      efficient star-schema joins. Sourced from int_order_details.
    semantic_model:
      enabled: true
      name: orders
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - order_pk
              - product_pk
              - order_line_number
    metrics:
      - name: total_revenue
        label: Total Revenue
        description: Sum of revenue across all order line items (quantity * unit price).
        type: simple
        agg: sum
        expr: "quantity_ordered * price_each"
      - name: total_quantity_sold
        label: Total Quantity Sold
        description: Total units sold across all orders.
        type: simple
        agg: sum
        expr: quantity_ordered
      - name: unique_orders_placed
        label: Unique Orders Placed
        description: Count of distinct orders placed by customers.
        type: simple
        agg: count_distinct
        expr: order_pk
    columns:
      - name: order_pk
        description: Surrogate key referencing dim_orders; derived from order_id.
        entity:
          type: foreign
          name: order
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_orders')
                field: order_pk
      - name: product_pk
        description: Surrogate key referencing dim_products; derived from product_code.
        entity:
          type: foreign
          name: product
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_pk
      - name: customer_pk
        description: Surrogate key referencing dim_customers; derived from customer_id.
        entity:
          type: foreign
          name: customer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_pk
      - name: order_line_number
        description: Sequence number of this line within its parent order.
        data_tests:
          - not_null
      - name: product_code
        description: Natural key of the ordered product.
      - name: quantity_ordered
        description: Number of units ordered for this product line.
      - name: price_each
        description: Unit sale price agreed for this line item.
