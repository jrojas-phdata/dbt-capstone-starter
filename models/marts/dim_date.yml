version: 2

models:
  - name: dim_date
    description: >
      Date dimension covering every calendar day from 2003-01-01 through 2005-12-31.
      Generated from the date spine in staging. Provides pre-computed date attributes
      for efficient time-based reporting without runtime date arithmetic.
    columns:
      - name: date_day
        description: Calendar date; primary key of the dimension.
        data_tests:
          - not_null
          - unique
      - name: date_year
        description: Four-digit calendar year (e.g. 2003).
      - name: date_quarter
        description: Quarter of the year (1–4).
      - name: date_month
        description: Month of the year (1–12).
      - name: date_week
        description: ISO week number of the year (1–53).
      - name: date_day_of_month
        description: Day of the month (1–31).
