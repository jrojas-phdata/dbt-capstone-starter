version: 2

models:
  - name: fct_payments
    description: >
      Payment fact table at the grain of one row per customer payment (check number).
      Surrogate customer key aligns with dim_customers. Sourced from
      stg_classic_models__payments.
    config:
      contract:
        enforced: true
    semantic_model:
      enabled: true
      name: payments
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - customer_pk
              - check_number
    metrics:
      - name: total_payments_received
        label: Total Payments Received
        description: Sum of all payment amounts received from customers.
        type: simple
        agg: sum
        expr: amount
      - name: payment_count
        label: Payment Count
        description: Count of distinct payments received by check number.
        type: simple
        agg: count_distinct
        expr: check_number
    columns:
      - name: customer_pk
        description: Surrogate key referencing dim_customers; derived from customer_id.
        data_type: varchar
        constraints:
          - type: not_null
        entity:
          type: foreign
          name: customer
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_pk
      - name: check_number
        description: Check number uniquely identifying the payment within a customer.
        data_type: varchar
        constraints:
          - type: not_null
        data_tests:
          - not_null
      - name: payment_date
        description: Date the payment was received.
        data_type: date
      - name: amount
        description: Total payment amount.
        data_type: number(18,2)
